<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Филтриране на ученици</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <heder class="menu">
            <h1>Списък ученици</h1>
            <p>Филтрация на списък от ученици с JavaScript</p>
        </heder>
    
        <section class="controls">
            <button id="allBtn">Всички</button>
            <button id="adultBtn">Възраст</button>
            <button id="excellentBtn">Отличници</button>
            <button id="cityBtn">От Разград</button>
        </section>


        <section class="student-grid" id="studentGrid">
            <div class="student-card">
                <h3>Име</h3>
                <p>Възраст</p>
                <p>Успех</p>
                <p>Град</p>
            </div>
        </section>
    </div>

    <script src="script.js"> </script>
</body>
</html>
